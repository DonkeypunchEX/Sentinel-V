title: Suricata IDS Signature — Brute Force / Scan
id: 8b7d5a90-1e34-4c77-8f2a-0d6b9c3e5a12
status: experimental
description: >
  Surfaces Suricata EVE alerts whose signature indicates brute-force or scanning
  activity (e.g. ET SCAN / SSH brute force rules). High precision because the
  underlying IDS signature already matched.
author: Sentinel-V
references:
  - https://attack.mitre.org/techniques/T1110/
logsource:
  product: suricata
detection:
  selection:
    source: suricata.eve
    kind: alert
  keywords:
    # Phrases that carry brute-force / scan intent. Bare "SSH" or "Login" are
    # deliberately excluded — they match benign protocol/policy signatures and
    # would spawn false HIGH T1110 incidents (list values combine with OR).
    alert.signature|contains:
      - Brute Force
      - Bruteforce
      - Password Guess
      - SCAN
  condition: selection and keywords
falsepositives:
  - Security scanners you operate yourself; allowlist their source IPs.
level: high
tags:
  - attack.credential_access
  - attack.t1110
