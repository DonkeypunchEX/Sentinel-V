[project]
name = "sentinel-v"
version = "0.1.0.dev0"
description = "Self-hostable defensive (blue-team) automation framework: detect, deceive, respond."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DonkeypunchEX" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.4", "pyod>=1.1", "joblib>=1.4", "numpy>=1.26"]
intel = ["OTXv2>=1.5", "requests>=2.32"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "pip-audit>=2.7", "httpx>=0.27", "types-PyYAML>=6.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentinel_v*"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
