name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[ml,intel,dev]"
      - run: ruff check sentinel_v tests
      - run: mypy sentinel_v
      - run: pytest -q
      - run: python -m sentinel_v.validation   # detection coverage; fails CI on a gap
      - run: pip-audit || true   # Phase 4: make this blocking
